<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Victoria's Secret · Consulta de inventario</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="vs-app"><header class="vs-header"><p class="brand">VICTORIA'S SECRET</p><h1>Consulta de inventario</h1><p class="subtitle">Escanea un código para consultar disponibilidad.</p></header>
  <section id="scanner-view"><section class="search-panel" aria-labelledby="search-title"><h2 id="search-title">Buscar producto</h2><form id="search-form"><label class="sr-only" for="barcode">Código de barras</label><input id="barcode" inputmode="numeric" autocomplete="off" autofocus placeholder="Escanea o ingresa un barcode"><button type="submit">Consultar</button></form><button id="catalog-toggle" class="secondary-action" type="button">Explorar catálogo</button><p id="message" role="status" aria-live="polite">Listo para consultar</p></section><section id="result" aria-live="polite"></section></section>
  <section id="catalog-view" hidden aria-labelledby="catalog-title"><div class="catalog-heading"><div><p class="eyebrow">CATÁLOGO LOCAL VS</p><h2 id="catalog-title">Explorar catálogo</h2><p class="subtitle">Navega por productos agrupados por STYLE + COLOR.</p></div><button id="back-scanner" class="secondary-action" type="button">Volver al escáner</button></div><form id="catalog-search" class="catalog-filters"><label for="catalog-query">Buscar</label><input id="catalog-query" type="search" placeholder="Descripción, STYLE, COLOR, barcode o referencia"><label for="catalog-department">Departamento</label><select id="catalog-department"><option value="">Todos</option></select><label for="catalog-section">Sección</label><select id="catalog-section"><option value="">Todas</option></select><label for="catalog-family">Familia</label><select id="catalog-family"><option value="">Todas</option></select><button type="submit">Buscar</button></form><p id="catalog-message" class="catalog-message" role="status" aria-live="polite"></p><section id="catalog-results" class="catalog-grid" aria-live="polite"></section><button id="catalog-more" class="secondary-action catalog-more" type="button" hidden>Mostrar más</button></section>
</main><script src="app.js"></script></body>
</html>
